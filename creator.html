<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">article creator - wikabedia</title>
  <link rel="apple-touch-icon" sizes="256x256" href="/img/wikabedia icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="shortcut icon" href="/img/wikabedia.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/css/creator.css?v=1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="maek wikabedia artical">
</head>

<body>
  <div class="topButtons left">
    <a class="button" href="/" title="Return to home page">
      <img src="/img/back.png">
      <p>back to home</p>
    </a>
  </div>

  <div class="topButtons right">
    <div class="button search">
      <img src="/img/search.png">
      <input type="text" placeholder="saerch for somting" id="searchBox">
    </div>
  </div>

  <br>
  
  <div class="article">
    <div class="articleImage">
      <img src="/img/wat-da-dog.jpg" id="articleBackgroundImage">
    </div>

    <form id="articleForm" onsubmit="return false;">
      <input class="articleTitle" id="articleTitle" type="text" required title="Article title goes here" placeholder="Write a title..." maxlength="28"></input>
      <div class="textTools">
        <button id="insertLink" class="link" type="button" title="Insert link"><img src="img/link.png"></button>
      </div>
      <textarea class="articleText" id="articleText" type="text" required spellcheck="true" title="Article text goes here" placeholder="Write something amazing, illegal, stupid . . ."></textarea>
      <div class="articleExtra">
        <div class="cardDesign">
          <img id="articleImagePreview" title="Upload image" src="img/Image upload hint.png">
          <input id="articleImage" type="file" accept="image/*">
          <input id="articleCardTitle" required placeholder="Article title..." title="This title is displayed on the home page" type="text" maxlength="20">
          <input id="articleCardDesc" required placeholder="Short description..." title="This description is displayed on the home page" type="text" maxlength="28">
        </div>
        <div class="extraInputs">
          <input id="articleWriter" type="name" required title="Your name goes here" placeholder="Your name..." maxlength="100"></input>
          <input id="articleEmail" type="email" required title="Your Email goes here" placeholder="Your Email..." maxlength="100"></input>
          <button class="articleSubmit">Submit</button>
        </div>
      </div>
    </form>
  </div>

  <hr>
  <footer>
    <span class="notice">&copy; 2026 <a href="https://butterdogco.com">ButterDogCo</a></span>

    <ul class="left">
      <span class="heading">legal</span>
      <li><a href="https://butterdogco.com/terms">terms AND conditions</a></li>
      <li><a href="https://butterdogco.com/privacy">privacy poolicy</a></li>
    </ul>

    <div class="seperator"></div>
    
    <ul class="right">
      <span class="heading">appearance</span>
      <li><button class="themeToggle">dark mode 🤤</button></li>
    </ul>
  </footer>

  <script src="js/main.js?v=2"></script>
  <script src="js/creator.js"></script>
  <script src="js/theme.js?v=2"></script>
</body>

</html>
